<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>無料相談お申し込み | クロスワーク</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select { width: 100%; padding: 10px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #0056b3; color: white; border: none; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>無料相談お申し込み</h2>
  <form id="entryForm">
    <div class="form-group">
      <label>希望職種</label>
      <input type="text" id="job" required>
    </div>
    <div class="form-group">
      <label>希望勤務地</label>
      <input type="text" id="location" required>
    </div>
    <div class="form-group">
      <label>年収</label>
      <input type="text" id="salary" required>
    </div>
    <div class="form-group">
      <label>お名前</label>
      <input type="text" id="name" required>
    </div>
    <div class="form-group">
      <label>電話番号</label>
      <input type="tel" id="phone" required>
    </div>
    <button type="submit" id="submitBtn">送信する</button>
  </form>

  <script>
    const GAS_URL = "★ここにGASのWebアプリURLを貼り付け★";

    document.getElementById('entryForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "送信中...";

      const payload = {
        job: document.getElementById('job').value,
        location: document.getElementById('location').value,
        salary: document.getElementById('salary').value,
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value
      };

      fetch(GAS_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert("送信が完了しました。担当者よりご連絡いたします。");
        document.getElementById('entryForm').reset();
        btn.disabled = false;
        btn.innerText = "送信する";
      })
      .catch(error => {
        alert("送信に失敗しました。時間をおいてお試しください。");
        btn.disabled = false;
        btn.innerText = "送信する";
      });
    });
  </script>
</body>
</html>
