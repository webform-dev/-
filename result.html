<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>送信結果</title>
</head>
<body>
<script>
  const params = new URLSearchParams(window.location.search);
  const status = params.get('status') || 'error';

  window.parent.postMessage({
    type: 'xwork-form-result',
    status: status
  }, window.location.origin);
</script>
</body>
</html>
